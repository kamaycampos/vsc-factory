# THE VSC CLIP FACTORY - 27 Sept 2026. GIN Project 15 clips get made with the Mac
# shut, for free, on a schedule, for as many weeks as nobody touches it.
#   source - the video, from this private repo's `sources` release (or Frame.io).
#   prep   - transcript, word timings and shot map: once per video, not once per clip.
#   shard  - split the clips that are not built yet into pairs.
#   build  - one server per pair, all at once, each reading its own files back.
#   collect- one release with the batch and a per-clip verdict.
# Private repository on purpose: 2,000 free minutes a month (a batch is ~200), and
# it is what allows the approved DIN Condensed font to live here at all.
name: vsc
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Build only these clip names (space separated). Empty = everything pending."
        required: false
        default: ""
  push:
    branches: [main]
    paths: ["plans/**"]
  schedule:
    - cron: "23 6 * * 1"          # Monday morning, after GIN posts the week's work
permissions:
  contents: write
concurrency:
  # WHY CANCELLED RUNS NEVER DIED (30 Sept, and runs 28 and 30 on 2 Oct): every retry
  # and collect job was gated on `if: always()`, and always() is true for a CANCELLED
  # run too - so a cancel stopped nothing, the run kept the group, and the newer run
  # sat "pending" behind it for 40 minutes. They are gated on `!cancelled()` now: they
  # still run after a failed job, and stop on a cancel. The group was renamed twice
  # that night to get past runs that were already stuck; vsc-3 is the clean one.
  group: vsc-3
  # A NEWER RUN ALWAYS WINS. 30 Sept 2026: a cancelled run sat in "in_progress" for
  # forty minutes refusing to die, and because the queue waited politely for it, the
  # corrected 20-clip batch never started - an hour and a half of nothing rendering,
  # with every status screen saying the work was underway. A newer run is always the
  # corrected plan, so there is nothing an older one can still be right about.
  cancel-in-progress: true
env:
  GH_TOKEN: ${{ github.token }}
  FRAMEIO_TOKEN: ${{ secrets.FRAMEIO_TOKEN }}
  VSC_KEY: ${{ secrets.VSC_KEY }}      # opens the font and the cached source
jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      # A bad plan fails here in seconds, before 20 servers spend an hour on it:
      # teachings cut short to fit a machine, clips over 120 s, stacked fixes.
      - name: Plan check
        run: python cloud/check_plan.py
      - uses: actions/cache@v4
        with: { path: ~/wcache, key: whisper-2ca53bb-small-en-v2-portable }
      - run: bash setup.sh
      - run: python cloud/prep.py
        env:
          SOURCE_MAY_CACHE: "1"     # prep runs alone; the parallel shards must never write

  # THE AUTOPILOT (5 Oct 2026). A stub plan (no clips yet - from the vsc-new form) gets
  # its clips from ONE Claude call with no tools (cloud/autoplan.py), kept only if code
  # finds every opening and closing line in the transcript and check_plan passes. Only
  # plans/ is committed; then a fresh run is started to build it, and this run stands down.
  # With no stub waiting this job takes seconds and changes nothing.
  autoplan:
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write
    outputs:
      planned: ${{ steps.a.outputs.planned }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - id: a
        run: |
          pip install -q anthropic
          python cloud/autoplan.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VSC_PLANNER_MODEL: ${{ vars.VSC_PLANNER_MODEL }}
      - name: Save the clips and build them
        if: steps.a.outputs.planned == '1'
        run: |
          git config user.name "vsc-autoplan"
          git config user.email "vsc-autoplan@users.noreply.github.com"
          git add plans/
          git commit -q -m "autoplan: clips chosen for ${{ steps.a.outputs.keys }}"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
          gh workflow run vsc.yml --ref main
      # RED, NOT GREEN, WHILE A BATCH WAITS (run 48, 7 Oct: autoplan could not find the
      # transcript, planned nothing, and every job went green with zero clips). Runs after
      # the save, so a batch that WAS planned is never lost to one that was not; the other
      # batches still build (shard does not need this job to succeed).
      - name: A batch is still waiting for its clips
        if: ${{ !cancelled() && steps.a.outputs.waiting != '' }}
        run: |
          echo "::error::No clips were chosen for: ${{ steps.a.outputs.waiting }} - the reason is in the step above."
          exit 1

  shard:
    needs: [prep, autoplan]
    # A failed autoplan never blocks the batches already planned; a successful one hands
    # over to the fresh run it started (which cancels this one - newer run wins).
    if: ${{ !cancelled() && needs.prep.result == 'success' && needs.autoplan.outputs.planned != '1' }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.s.outputs.matrix }}
      count: ${{ steps.s.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - id: s
        run: python cloud/shard.py
        env:
          ONLY: ${{ inputs.only }}

  build:
    needs: shard
    if: ${{ !cancelled() && needs.shard.result == 'success' && needs.shard.outputs.count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false            # one bad clip must not take the batch down
      max-parallel: 20   # every shard at once; 10 meant a second wave and double the wall time
      matrix:
        include: ${{ fromJSON(needs.shard.outputs.matrix) }}
    env:
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/cache@v4
        with: { path: ~/wcache, key: whisper-2ca53bb-small-en-v2-portable }
      - run: bash setup.sh
      - name: Build and check this pair
        run: python cloud/build.py "${{ matrix.key }}" ${{ matrix.names }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}            # a red shard still carries the clips that DID build
        with:
          name: shard-${{ matrix.key }}-${{ matrix.shard }}
          path: /tmp/shard_out
          retention-days: 7

  collect:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: /tmp/shards, pattern: shard-* }
      - run: python cloud/collect.py /tmp/shards

  # ---------------------------------------------------------------- SECOND ATTEMPT
  # On 29 Sept two shards were killed mid-render by "the runner has received a
  # shutdown signal" - GitHub reclaiming the machine, nothing to do with the clips.
  # Four clips were simply missing from the batch and the only way to notice was to
  # count them. So the run retries itself: re-shard against the release (shard.py
  # only ever picks clips that are NOT published yet), build those, publish those.
  # It cannot recurse - the rounds are written out, so there are exactly three - and
  # each round costs nothing when there is nothing left to do: count is 0, no build.
  # Self-dispatch was the other option and does not work: a workflow_dispatch made
  # with GITHUB_TOKEN is refused on purpose, and a PAT is a secret that expires.
  shard2:
    needs: collect
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.s.outputs.matrix }}
      count: ${{ steps.s.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - id: s
        run: python cloud/shard.py
        env:
          ONLY: ${{ inputs.only }}

  build2:
    needs: shard2
    if: ${{ !cancelled() && needs.shard2.outputs.count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 20   # every shard at once; 10 meant a second wave and double the wall time
      matrix:
        include: ${{ fromJSON(needs.shard2.outputs.matrix) }}
    env:
      SHARD: r2-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/cache@v4
        with: { path: ~/wcache, key: whisper-2ca53bb-small-en-v2-portable }
      - run: bash setup.sh
      - name: Build and check this pair
        run: python cloud/build.py "${{ matrix.key }}" ${{ matrix.names }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: shard-${{ matrix.key }}-r2-${{ matrix.shard }}
          path: /tmp/shard_out
          retention-days: 7

  collect2:
    needs: build2
    if: ${{ !cancelled() && needs.shard2.outputs.count != '0' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: /tmp/shards, pattern: shard-*-r2-* }
      - run: python cloud/collect.py /tmp/shards

  # ----------------------------------------------------------------- THIRD ATTEMPT
  shard3:
    needs: collect2
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.s.outputs.matrix }}
      count: ${{ steps.s.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - id: s
        run: python cloud/shard.py
        env:
          ONLY: ${{ inputs.only }}

  build3:
    needs: shard3
    if: ${{ !cancelled() && needs.shard3.outputs.count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 20   # every shard at once; 10 meant a second wave and double the wall time
      matrix:
        include: ${{ fromJSON(needs.shard3.outputs.matrix) }}
    env:
      SHARD: r3-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/cache@v4
        with: { path: ~/wcache, key: whisper-2ca53bb-small-en-v2-portable }
      - run: bash setup.sh
      - name: Build and check this pair
        run: python cloud/build.py "${{ matrix.key }}" ${{ matrix.names }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: shard-${{ matrix.key }}-r3-${{ matrix.shard }}
          path: /tmp/shard_out
          retention-days: 7

  collect3:
    needs: build3
    if: ${{ !cancelled() && needs.shard3.outputs.count != '0' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: /tmp/shards, pattern: shard-*-r3-* }
      - run: python cloud/collect.py /tmp/shards

  # The one line that says whether the batch is actually complete. shard.py asks the
  # release what exists; if anything in the plans is still not there after three
  # rounds the run ends RED with the names in it, instead of a green tick over a
  # batch that is short four clips.
  verify:
    needs: [collect, collect2, collect3]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python cloud/verify.py
